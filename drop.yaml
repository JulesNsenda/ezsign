# DROP deployment manifest
#
# Deploys ezsign as a MONOREPO: the backend and frontend become two apps that
# share ONE hostname — the frontend served at `/`, the backend reverse-proxied
# at `/api` (same-origin, so no CORS). Requires a DROP server running the
# monorepo/multi-service feature (drop `develop` or a release that includes it).
#
# NOTE (prerequisites — see the PR description):
#   * Redis: no longer needed. The backend is Postgres-only (queues run on
#     pg-boss, rate limiting is in-memory, the JWT blacklist is a Postgres
#     table) — a Drop deploy needs only JWT_SECRET + DATABASE_URL as secrets.
#   * DB migrations: run automatically at startup — `scripts/start-prod.js`
#     executes node-pg-migrate against the injected DATABASE_URL before
#     starting the server, then the app bootstraps the first admin (one-time
#     password printed to the app logs).
#   * build/start below require DROP to honor drop.yaml build/start overrides
#     (a DROP-side fix — the TypeScript backend won't compile/start without it).
name: ezsign

services:
  # --- API: Express + TypeScript (compiled with tsc) ---
  backend:
    path: backend
    type: nodejs
    build: npm run build            # backend "build": "tsc"  -> dist/
    start: node scripts/start-prod.js  # migrations first, then dist/server.js
    database: postgres              # DROP provisions Postgres and injects DATABASE_URL
    secrets:
      # DROP auto-generates a strong value at first start and injects it as an
      # env var (needs a DROP server with the required-secrets feature). It is
      # generated only if unset, so it stays STABLE across redeploys (existing
      # tokens keep working) and never has to be set by hand on a fresh deploy.
      JWT_SECRET:
        generate: random
        description: Signing key for auth tokens (JWT)
    route:
      path: /api                    # -> ezsign.<domain>/api
    env:
      NODE_ENV: production
      # /tmp is THE ONLY WRITABLE PATH on DROP. Measured, not assumed - a
      # throwaway probe app deployed to DROP reported:
      #
      #   /app/storage, /app/data, /app/uploads  -> ENOENT
      #   /data, /storage, /var/data             -> EACCES
      #   /tmp, /tmp/storage                     -> mkdir ok, write ok
      #
      # The ENOENT is what makes this so confusing to debug. /app exists, is a
      # directory, and stats as mode 0755 owned by the very uid running the
      # process (1000:1000) - so a write there "should" succeed. DROP sandboxes
      # the app directory read-only and masks writes as ENOENT rather than the
      # EROFS/EACCES you would expect, and `mkdir -p` reports it as though a
      # parent were missing. cwd is a red herring: it is /app, and `./storage`
      # simply resolved to /app/storage.
      #
      # !! THIS IS A STOPGAP, NOT A SOLUTION !!
      # /tmp is scratch space. Uploaded and SIGNED PDFs stored here do not
      # survive a restart or redeploy, and may be reclaimed by the OS at any
      # time - while the `documents` rows describing them persist in Postgres.
      # The result is a record of a document that can no longer be produced,
      # which for an e-signing platform means losing the legally meaningful
      # artifact. Acceptable ONLY to demo/exercise the app on DROP.
      #
      # The real fix is durable object storage (an S3StorageAdapter already
      # exists in this repo) or a persistent volume, which DROP does not
      # currently offer. Do NOT accept real signatures on this deployment
      # until one of those is in place.
      FILE_STORAGE_PATH: /tmp/ezsign-storage

  # --- Web app: React + Vite ---
  frontend:
    path: frontend
    type: static                    # DROP builds it natively: npm install + npm run build -> serves dist/
    build_env:
      # Absolute origin ONLY - no trailing slash, no /api. client.ts does
      # `baseURL: ${VITE_API_URL}/api`, and the frontend is served at this same
      # origin, so API calls stay same-origin (no CORS).
      # NOTE: "" does NOT work here - client.ts falls back with
      # `import.meta.env.VITE_API_URL || 'http://localhost:3001'`, and an empty
      # string is falsy, so it bakes in the localhost dev URL at build time.
      VITE_API_URL: "https://ezsign.dropkit.sh"
    route:
      path: /                       # -> ezsign.<domain>
